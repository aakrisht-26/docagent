# ============================================================
# DocAgent -- Default Configuration (Groq-only)
# All values can be overridden via environment variables.
# ============================================================

app:
  name: "DocAgent"
  version: "1.0.0"
  max_file_size_mb: 50
  log_level: "INFO"
  log_file: "logs/docagent.log"
  # When true, the UI re-raises pipeline exceptions instead of catching them and
  # rendering an error message. Use while debugging so Streamlit shows its own
  # traceback. Override with DOCAGENT_DEBUG=true.
  debug: false

# -- Groq Cloud API Settings ------------------------------------
# REQUIRED: Set GROQ_API_KEY as an environment variable.
groq:
  enabled: true
  api_keys: "PASTE_MULTIPLE_GROQ_API_KEYS_HERE" # Comma separated for fallback
  api_key: "PASTE_YOUR_GROQ_API_KEY_HERE"  # Single key Or set GROQ_API_KEY env var
  base_url: "https://api.groq.com/openai/v1"
  model: "llama-3.3-70b-versatile"
  timeout_seconds: 180
  temperature: 0.15
  # A 429 whose retry window exceeds this many seconds means the key is
  # exhausted for that window rather than briefly throttled, so it is parked and
  # the next key is used immediately. Per-minute limits (TPM/RPM) clear in
  # seconds and fall below this; per-day limits (TPD/RPD) quote minutes or hours
  # and land above it. Parking expires automatically when the window elapses.
  park_threshold_seconds: 15
  # Groq's TPD limit is a ROLLING window, not a daily bucket — verified from two
  # refusals on the same key 32m50s apart where `Used` fell from 99,588 to
  # 98,426 while that key was only being refused. The quoted retry-after answers
  # only for the request that was refused, so parking for it keeps a key out far
  # longer than a smaller call needs. Day-window parks are instead scaled to the
  # time required to free this many tokens. Lower = keys return sooner but may
  # be refused once more; higher = closer to the old behaviour.
  park_min_request_tokens: 500
  # Cost estimation is DISABLED (both rates zero) because this project runs on
  # free-tier Groq keys, where dollar cost is not the constraint — rate limits
  # are. Token counts are still logged per run; only the dollar line is
  # suppressed. To enable an estimate on a paid plan, set these to the current
  # per-million rates from https://groq.com/pricing for the model in use.
  pricing:
    input_usd_per_million: 0.0
    output_usd_per_million: 0.0

# -- PDF Parsing Settings ---------------------------------------
pdf:
  use_ocr_fallback: true
  ocr_language: "eng"
  extract_tables: true
  max_pages: 500
  use_gpu: true # For PP-Structure Table Vision
  # High-fidelity table extraction (PP-Structure) runs on GPU in seconds/page
  # but takes 15-25 MINUTES/page on CPU. It is automatically skipped when no
  # CUDA GPU is detected. Set the following to true ONLY if you accept very slow
  # CPU processing and still want PP-Structure table parsing.
  allow_cpu_structure: false
  # GPU detection short-circuits before importing paddle (~2s) when the CUDA
  # driver is missing, or when only the CPU-only `paddlepaddle` wheel is
  # installed. Set true to always run the authoritative paddle probe instead —
  # only needed for unusual builds shipping CUDA under the plain name.
  force_gpu_probe: false

# -- Excel Parsing Settings -------------------------------------
excel:
  max_sheets: 50
  include_formulas: false
  max_rows_per_sheet: 10000

# -- Audio & YouTube Settings ----------------------------------
audio:
  max_duration_seconds: 3600  # 1 hour limit
  default_language: null      # auto-detect
  extract_timestamps: true    # Include word-level timings from Whisper

# -- Summarization Settings ------------------------------------
summarization:
  chunk_size: 4000
  chunk_overlap: 300
  max_summary_length: 3000
  extractive_sentences: 15

# -- Classification Settings ------------------------------------
classification:
  questionnaire_threshold: 0.35

# -- Question Extraction Settings -------------------------------
question_extraction:
  min_questions: 1
  dedup: true
  max_questions: 200
  llm_threshold: 0

# -- Export / Download Settings ---------------------------------
export:
  pdf_font_size: 11
  pdf_margin_inch: 0.9
